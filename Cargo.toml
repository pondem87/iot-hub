[package]
name = "iot-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["chrono", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2"

[features]
database-tests = []

[[test]]
name = "users_persistence"
path = "tests/users_persistence.rs"
required-features = ["database-tests"]
